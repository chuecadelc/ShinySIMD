name: UI/Server Output Matching Check

# Verifies that every output-producing UI element
#  has a corresponding server-side. 

# Also flags server outputs defined but never referenced in the
# UI (likely dead code / leftover from a refactor).


args <- commandArgs(trailingOnly = TRUE)
app_file <- if (length(args) >= 1) args[1] else "App.R"

if (!file.exists(app_file)) {
  stop("Could not find app file at: ", app_file,
       "\nPass the correct path as an argument, e.g. Rscript check_ui_server_ids.R path/to/App.R")
}

code <- paste(readLines(app_file, warn = FALSE), collapse = "\n")

# --- Extract UI-side output/download IDs ---

# Matches: plotOutput("id"), DTOutput('id'), leafletOutput("id"),
# uiOutput("id"), downloadButton("id", ...), downloadLink("id", ...), etc.

ui_pattern <- "(?:[A-Za-z]+Output|downloadButton|downloadLink)\\(\\s*[\"']([\\w\\.]+)[\"']"
ui_matches <- regmatches(code, gregexpr(ui_pattern, code, perl = TRUE))[[1]]
ui_ids <- unique(gsub(ui_pattern, "\\1", ui_matches, perl = TRUE))

# --- Extract server-side output definitions ---

# Matches: output$id <- renderPlot({...}), output$id <- downloadHandler(...)
server_pattern <- "output\\$([\\w\\.]+)\\s*<-"
server_matches <- regmatches(code, gregexpr(server_pattern, code, perl = TRUE))[[1]]
server_ids <- unique(gsub(server_pattern, "\\1", server_matches, perl = TRUE))


missing_server  <- sort(setdiff(ui_ids, server_ids))
orphaned_server <- sort(setdiff(server_ids, ui_ids))

cat("============================================================\n")
cat("UI / Server Output Matching Check\n")
cat("============================================================\n")


cat("UI output/download elements found: ", length(ui_ids), "\n")
cat("Server output definitions found:   ", length(server_ids), "\n")
cat("Missing server outputs:            ", length(missing_server), "\n")
cat("Orphaned server outputs:           ", length(orphaned_server), "\n\n")

if (length(missing_server) > 0) {
  cat("FAIL: The following UI elements have NO matching server output.\n")
  cat("      These are broken -- e.g. a download button that produces nothing.\n\n")
  cat(paste0("  - ", missing_server, collapse = "\n"), "\n\n")
}

if (length(orphaned_server) > 0) {
  cat("WARNING: The following server outputs are defined but never\n")
  cat("         referenced anywhere in the UI (likely dead code):\n\n")
  cat(paste0("  - ", orphaned_server, collapse = "\n"), "\n\n")
}

if (length(missing_server) == 0 && length(orphaned_server) == 0) {
  cat("SUCCESS: All ", length(ui_ids),
      " UI output/download elements have matching server definitions.\n", sep = "")
  cat("SUCCESS: No orphaned server outputs were found.\n")
}

# Only fail the build for genuinely broken UI elements -- orphaned server
# code is a warning worth reviewing, not a functional bug
if (length(missing_server) > 0) {
  quit(status = 1)
}